[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
; supervisord itself intentionally stays root -- see deploy/entrypoint.sh
; and the per-program user= directives below, which are what actually
; drop web/worker/scheduler to PUID:PGID.
user=root

[program:web]
priority=10
command=uvicorn backend.main:app --host 0.0.0.0 --port 8000 --loop asyncio --lifespan on
directory=/app
; Drops this process to PUID:PGID (set by deploy/entrypoint.sh, which
; creates that account before supervisord starts). supervisord itself
; stays root -- see entrypoint.sh for why.
user=%(ENV_PUID)s
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",HOME="/tmp"

[program:worker]
priority=20
depends_on=web
command=python -m backend.jobs.worker
directory=/app
user=%(ENV_PUID)s
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",HOME="/tmp"

[program:scheduler]
priority=30
depends_on=web
command=python -m backend.scheduler
directory=/app
user=%(ENV_PUID)s
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",HOME="/tmp"