[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
; supervisord itself intentionally stays root -- see deploy/entrypoint.sh
; and the per-program user= directives below, which are what actually
; drop web/worker/scheduler to PUID:PGID.
user=root

[program:web]
priority=10
command=uvicorn backend.main:app --host 0.0.0.0 --port 8000 --loop asyncio --lifespan on
directory=/app
; Drops this process to PUID:PGID (set by deploy/entrypoint.sh, which
; creates that account before supervisord starts). supervisord itself
; stays root -- see entrypoint.sh for why.
user=%(ENV_PUID)s
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",HOME="/tmp"

; Workers are split by job family so that a slow yt-dlp download never
; holds up metadata imports (a big "follow" queues hundreds of jobs of
; each kind) and vice versa. Each worker only reserves the job types in
; its WORKER_JOB_TYPES; WORKER_NAME must be stable across restarts (it's
; how a restarted worker reclaims the job its previous incarnation died
; holding -- see backend/jobs/jobqueue.py).
;
; Only worker-download talks to YouTube for media. DOWNLOAD_WORKERS
; (defaulted to 3 in deploy/entrypoint.sh) is how many such processes
; exist; how many are *active* is the download.max_concurrent setting
; (default 1), which the workers re-read every poll -- see
; backend/jobs/gate.py. So the process count is a ceiling, not a load.

[program:worker-download]
priority=20
depends_on=web
numprocs=%(ENV_DOWNLOAD_WORKERS)s
process_name=%(program_name)s-%(process_num)d
command=python -m backend.jobs.worker
directory=/app
user=%(ENV_PUID)s
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",HOME="/tmp",WORKER_NAME="%(program_name)s-%(process_num)d",WORKER_JOB_TYPES="download_track"

[program:worker-metadata]
priority=21
depends_on=web
command=python -m backend.jobs.worker
directory=/app
user=%(ENV_PUID)s
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",HOME="/tmp",WORKER_NAME="worker-metadata",WORKER_JOB_TYPES="sync_chart,sync_artist,import_album"

[program:worker-lyrics]
priority=22
depends_on=web
command=python -m backend.jobs.worker
directory=/app
user=%(ENV_PUID)s
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",HOME="/tmp",WORKER_NAME="worker-lyrics",WORKER_JOB_TYPES="download_lyrics"

[program:scheduler]
priority=30
depends_on=web
command=python -m backend.scheduler
directory=/app
user=%(ENV_PUID)s
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",HOME="/tmp"