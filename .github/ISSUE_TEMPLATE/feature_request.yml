name: Feature request
description: An idea for something new, or for doing something differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The need behind the idea. What's hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Screenshots or examples from other apps are welcome.

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead today?
      description: A workaround, or another way you thought of.
